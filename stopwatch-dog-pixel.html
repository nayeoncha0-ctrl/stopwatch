<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽셀 산책 스탑워치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfe3f5; color:#fff;
    font-family:'Galmuri11','Galmuri9','DotGothic16','Malgun Gothic',monospace; }
  #cv { position:fixed; left:0; top:0; image-rendering:pixelated; image-rendering:crisp-edges; image-rendering:pixelated; }

  .px { background:#2b3566; border:4px solid #fff; box-shadow:0 0 0 4px #1d2450, 6px 6px 0 4px rgba(20,25,70,.45); }
  #hud { position:fixed; top:clamp(14px,3.5vh,34px); left:50%; transform:translateX(-50%); width:min(88vw,400px); padding:12px 18px 18px; text-align:center; }
  #chip { display:inline-block; font-size:13px; padding:4px 10px; background:#4a58a8; border:2px solid #fff; }
  #display { font-size:clamp(44px,9vw,72px); margin:10px 0 12px; line-height:1; white-space:nowrap; text-shadow:4px 4px 0 #1d2450; }
  #display .d { display:inline-block; width:.66em; text-align:center; }
  #display .dot { display:inline-block; width:.3em; text-align:center; }
  #display small { font-size:.5em; color:#ffd1dc; }
  .btns { display:flex; gap:12px; }
  button { flex:1; font-family:inherit; font-size:16px; padding:12px 6px; cursor:pointer; color:#fff; background:#ff7f9e;
    border:3px solid #fff; box-shadow:0 0 0 3px #1d2450, 0 7px 0 3px #1d2450; margin-bottom:7px; transition:transform .06s; }
  button:active { transform:translateY(5px); box-shadow:0 0 0 3px #1d2450, 0 2px 0 3px #1d2450; }
  button.stop { background:#ff6a4f; }
  button.sec { background:#6f7bc7; }
  button:disabled { opacity:.55; cursor:default; }

  #lapsPanel { position:fixed; right:clamp(14px,2vw,30px); top:clamp(14px,3.5vh,34px); width:min(250px,42vw); padding:10px 14px; display:none; }
  #lapsPanel h3 { margin:0 0 6px; font-size:14px; font-weight:400; color:#ffd1dc; }
  ul { list-style:none; margin:0; padding:0; max-height:42vh; overflow-y:auto; }
  li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-top:2px dashed rgba(255,255,255,.3); font-size:13px; }
  li span:first-child { opacity:.7; }
  li.best { color:#8bf0b0; } li.worst { color:#ffa89c; }
  .hint { position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:12px; color:#2b3566; pointer-events:none; text-shadow:1px 1px 0 #fff; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="px">
  <div id="chip">겨울 · 아침</div>
  <div id="display"></div>
  <div class="btns">
    <button id="lap" class="sec" disabled>랩</button>
    <button id="start">출발!</button>
  </div>
</div>
<div id="lapsPanel" class="px"><h3>▶ 랩 기록</h3><ul id="laps"></ul></div>
<div class="hint">스페이스: 시작/정지 · L: 랩 · R: 초기화</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const DAY_MS = 60000;
let W = 320, H = 160, SCALE = 4;

function resize() {
  SCALE = Math.max(2, Math.round(innerHeight / 150));
  W = Math.ceil(innerWidth / SCALE); H = Math.ceil(innerHeight / SCALE);
  cv.width = W; cv.height = H;
  cv.style.width = W * SCALE + 'px'; cv.style.height = H * SCALE + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* ---------- 도우미 ---------- */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function disc(cx, cy, r, c) {
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r + r * .6 - dy * dy));
    ctx.fillRect(Math.round(cx) - w, Math.round(cy) + dy, w * 2 + 1, 1);
  }
}
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const lerp = (a, b, t) => a + (b - a) * t;
const mix = (c1, c2, t) => { const a = hex2rgb(c1), b = hex2rgb(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; };
const smooth = t => t * t * (3 - 2 * t);
const mod = (a, n) => ((a % n) + n) % n;

const KEYS = [
  { t: 0,   top: '#c9b8e8', bot: '#ffe4dc', night: 0 },
  { t: .3,  top: '#9ccbf0', bot: '#eaf5ff', night: 0 },
  { t: .6,  top: '#6f5fa8', bot: '#ffb08c', night: .25 },
  { t: .85, top: '#101845', bot: '#2d3f7c', night: 1 },
  { t: 1,   top: '#c9b8e8', bot: '#ffe4dc', night: 0 }
];
function sky(t) {
  let i = 0;
  while (i < KEYS.length - 2 && t >= KEYS[i + 1].t) i++;
  const a = KEYS[i], b = KEYS[i + 1], k = smooth((t - a.t) / (b.t - a.t));
  return { top: mix(a.top, b.top, k), bot: mix(a.bot, b.bot, k), night: lerp(a.night, b.night, k) };
}
const rgbParse = s => s.match(/\d+/g).map(Number);
const rgbMix = (s1, s2, t) => { const a = rgbParse(s1), b = rgbParse(s2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; };

/* ---------- 강아지 픽셀 스프라이트 ---------- */
const SW = 58, SH = 46;
const dogCv = document.createElement('canvas'); dogCv.width = SW; dogCv.height = SH;
const dctx = dogCv.getContext('2d');
const C = { K: '#7a4222', O: '#eca96d', O2: '#f6c08a', G: '#a2948a', o: '#fdeed6', B: '#2a2523', b: '#554c47', N: '#161110', P: '#ff8fa3',
  Rr: '#e94f5b', Rl: '#ff8a93', W: '#ffffff', S: '#d9d2cb', LO: '#c68a58', EAR: '#cf9468' };
// 복슬복슬한 가장자리를 가진 타원
const bump = (cx, cy, rx, ry, n, amp, ph = 0) => (x, y) => {
  const dx = (x - cx) / rx, dy = (y - cy) / ry, a = Math.atan2(dy, dx);
  return Math.hypot(dx, dy) <= 1 + amp * Math.cos(n * a + ph);
};
const or = (...f) => (x, y) => f.some(g => g(x, y));

function buildDog(p) {
  const grid = new Array(SW * SH).fill(null);
  const set = (x, y, c) => { if (x >= 0 && x < SW && y >= 0 && y < SH) grid[y * SW + x] = c; };
  const part = (test, color, line = C.K) => {
    const px = [];
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) if (test(x, y)) px.push([x, y]);
    px.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([a, b]) => set(x + a, y + b, line)));
    px.forEach(([x, y]) => set(x, y, color(x, y)));
  };
  const leg = (x0, phase, dark) => {
    let dx = 0, lift = 0;
    if (p.walking) { dx = Math.round(3.2 * Math.sin(phase)); lift = Math.cos(phase) > .3 ? 1 : 0; }
    part((x, y) => {
      if (y < 39 || y > 44 - lift) return false;
      const xr = x0 + Math.round(dx * (y - 39) / 5);
      return x >= xr && x <= xr + 3;
    }, (x, y) => y >= 42 - lift ? (dark ? C.S : C.W) : (dark ? C.LO : C.O));
  };

  // 먼 쪽 다리
  leg(17, p.phase + Math.PI, true);
  leg(29, p.phase, true);
  // 복슬 몸통
  part(bump(24, 31, 15, 10.5, 15, .07, .4), (x, y) => {
    if (y <= 24) return C.G;
    if (y <= 26) return x % 2 === 0 ? C.G : C.O;
    if (y >= 38) return C.o;
    return (x + y) % 7 === 0 ? C.O2 : C.O;
  });
  // 까만 꼬리 (등 위로 말아 올린 복슬 꼬리)
  const w = p.wag;
  part(or(bump(10, 26, 3, 5, 8, .12), bump(11 + w, 20, 4, 5, 8, .12, 1), bump(15 + w, 15, 4, 3, 8, .14, 2)),
    (x, y) => ((x + y) % 5 === 0 && y < 24) ? C.b : C.B, '#0d0a09');
  // 가까운 쪽 다리
  leg(12, p.phase, false);
  leg(34, p.phase + Math.PI, false);
  // 가슴 털 (크림색 갈기)
  part(bump(37, 36, 7, 5, 9, .12, 1), (x, y) => (x + y) % 6 === 0 ? C.O2 : C.o);
  // 작은 귀
  const earL = { 4: [36, 36], 5: [35, 36], 6: [35, 37], 7: [34, 37], 8: [34, 38], 9: [33, 38], 10: [33, 38], 11: [33, 38] };
  const inEar = (x, y, mir) => { const r = earL[y]; if (!r) return false; const xx = mir ? 82 - x : x; return xx >= r[0] && xx <= r[1]; };
  const ey = p.ear ? 1 : 0;
  part((x, y) => inEar(x, y - ey, false) || inEar(x, y - ey, true),
    (x, y) => { const yy = y - ey, xx = x > 41 ? 82 - x : x; return ((yy === 7 || yy === 8) && xx === 36) || (yy === 9 && (xx === 36 || xx === 37)) ? C.P : C.EAR; });
  // 동그랗고 복슬한 머리 + 볼털
  part(or(bump(41, 22, 12, 11, 13, .07, 0), bump(32, 27, 5, 4, 7, .15), bump(50, 27, 5, 4, 7, .15, 1)), (x, y) => {
    if (y <= 14) return C.G;
    if (y <= 16) return x % 2 === 0 ? C.G : C.O;
    return (x * 3 + y) % 9 === 0 ? C.O2 : C.O;
  });
  // 얼굴
  const m = bump(41, 27, 5, 3.4, 1, 0);
  for (let y = 22; y < 32; y++) for (let x = 34; x < 49; x++) if (m(x, y)) set(x, y, C.o);
  [[35, 25], [36, 25], [46, 25], [47, 25]].forEach(([x, y]) => set(x, y, C.P));        // 볼터치
  [[40, 25], [41, 25], [42, 25]].forEach(([x, y]) => set(x, y, C.N)); set(41, 26, C.N); // 까만 코
  [[39, 27], [40, 28], [41, 27], [42, 28], [43, 27]].forEach(([x, y]) => set(x, y, '#4a3226')); // 입
  set(41, 28, C.P); if (p.tongue) set(41, 29, C.P);
  // 눈 (크고 반짝)
  const eye = (ex, hx) => {
    if (p.blink) { set(ex, 22, C.N); set(ex + 1, 22, C.N); set(ex + 2, 22, C.N); return; }
    for (let y = 19; y <= 22; y++) { set(ex, y, C.N); set(ex + 1, y, C.N); if (y >= 20 && y <= 21) set(ex + 2, y, C.N); }
    set(ex + 2, 19, C.N);
    set(hx, 19, C.W); set(ex, 21, '#6a3f2c'); set(ex + 1, 22, '#6a3f2c');
  };
  eye(35, 36); eye(44, 45);
  // 목도리
  const sw = p.sway;
  part(or(bump(41, 33, 9, 2, 1, 0), (x, y) => x >= 35 + (y >= 38 ? sw : 0) && x <= 37 + (y >= 38 ? sw : 0) && y >= 34 && y <= 40),
    (x, y) => (x + y) % 4 === 0 ? C.Rl : C.Rr, '#8f2430');

  dctx.clearRect(0, 0, SW, SH);
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
    const c = grid[y * SW + x];
    if (c) { dctx.fillStyle = c; dctx.fillRect(x, y, 1, 1); }
  }
}

/* ---------- 풍경 ---------- */
const stars = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random() * .6 }));
const flakes = Array.from({ length: 90 }, () => {
  const big = Math.random() < .3;
  return { x: Math.random(), y: Math.random(), v: big ? 24 : 12 + Math.random() * 8, big, w: .6 + Math.random() * 1.2, ph: Math.random() * 6, par: big ? .35 : .18 };
});
const pebbles = [[8, 8], [40, 20], [72, 12], [110, 24], [150, 10], [190, 20], [230, 14], [270, 24], [300, 8], [340, 18]];

function pine(x, base, sc, dark, light) {
  const rows = Math.round(10 * sc), step = Math.round(8 * sc);
  const top = base - Math.max(1, Math.round(4 * sc)) - (2 * step + rows);
  R(x - (sc >= 1 ? 1 : 0), base - Math.round(4 * sc), sc >= 1 ? 3 : 1, Math.round(4 * sc), '#7a5538');
  for (let k = 0; k < 3; k++) {
    for (let r = 0; r < rows; r++) {
      const half = Math.round((1 + 2 * k) * sc + r * .6 * sc + (sc >= 1 ? 0 : 0));
      const y = top + k * step + r, snow = r < rows * .45 && sc >= .8;
      if (snow) {
        R(x - half, y, half * 2 + 1, 1, '#fff');
        R(x + Math.floor(half * .4), y, Math.ceil(half * .6) + 1, 1, '#dfeaf7');
      } else {
        R(x - half, y, half + 1, 1, dark);
        R(x + 1, y, half, 1, light);
      }
    }
  }
}
function cloud(x, y) {
  R(x + 4, y, 10, 2, '#fff'); R(x, y + 2, 18, 3, '#fff'); R(x + 2, y + 5, 14, 2, '#eaf2fb');
  R(x + 7, y - 2, 6, 2, '#fff');
}
function lamp(x, base, glow) {
  if (glow > .05) { ctx.globalAlpha = glow * .22; disc(x + 1, base - 26, 16, '#ffd97a'); ctx.globalAlpha = glow * .22; disc(x + 1, base - 26, 10, '#ffd97a'); ctx.globalAlpha = 1; }
  R(x, base - 24, 2, 24, '#3b3f52'); R(x - 2, base - 31, 6, 7, '#3b3f52');
  R(x - 1, base - 30, 4, 5, glow > .3 ? '#ffe9a0' : '#9aa3b8'); R(x - 3, base - 33, 8, 2, '#fff');
}
function snowman(x, base) {
  R(x - 6, base + 1, 14, 1, 'rgba(27,42,85,.2)');
  disc(x, base - 6, 6, '#fff'); disc(x, base - 16, 4, '#fff');
  R(x + 2, base - 5, 3, 3, '#dfeaf7'); R(x + 1, base - 15, 2, 2, '#dfeaf7');
  R(x - 2, base - 17, 1, 1, '#222'); R(x + 1, base - 17, 1, 1, '#222');
  R(x, base - 15, 3, 1, '#ff9640');
  R(x - 4, base - 12, 9, 1, '#e94f5b'); R(x - 4, base - 11, 2, 3, '#e94f5b');
  R(x, base - 8, 1, 1, '#222'); R(x, base - 5, 1, 1, '#222');
  R(x - 11, base - 12, 6, 1, '#7a5538'); R(x - 11, base - 14, 1, 2, '#7a5538');
  R(x + 6, base - 11, 6, 1, '#7a5538'); R(x + 11, base - 13, 1, 2, '#7a5538');
  R(x - 4, base - 22, 9, 1, '#38405e'); R(x - 2, base - 25, 5, 3, '#38405e');
}
function mound(x, y, r) { for (let i = 0; i < r; i++) { const w = Math.round(r * Math.sqrt(1 - (i / r) ** 2)); R(x - w, y - i, w * 2, 1, '#fff'); } R(x - r + 2, y, r * 2 - 4, 1, '#cfdff0'); }

const PHASES = ['아침', '낮', '저녁', '밤'];
let lastPhase = -1;

function draw(ms, now, walking) {
  const t = (ms % DAY_MS) / DAY_MS, sk = sky(t);
  const groundTop = H - 56, pathTop = H - 34;
  // 하늘 (층층이 끊어진 그라데이션)
  const BANDS = 14;
  for (let i = 0; i < BANDS; i++) {
    const y0 = Math.floor(i * groundTop / BANDS), y1 = Math.floor((i + 1) * groundTop / BANDS) + 1;
    R(0, y0, W, y1 - y0, rgbMix(sk.top, sk.bot, i / (BANDS - 1)));
  }
  // 별
  if (sk.night > .05) stars.forEach((s, i) => {
    if (Math.sin(now / 400 + i) > -.2) { ctx.globalAlpha = Math.min(1, sk.night * 1.2); R(s.x * W, s.y * groundTop, 1, 1, '#fff'); }
  });
  ctx.globalAlpha = 1;
  // 해 / 달
  const sp = t / .68;
  if (sp <= 1) {
    ctx.globalAlpha = Math.min(1, Math.sin(Math.PI * sp) * 4);
    const x = W * (.05 + .9 * sp), y = groundTop - 8 - Math.sin(Math.PI * sp) * groundTop * .75;
    disc(x, y, 11, '#fff6c4'); disc(x, y, 8, '#ffe27a');
    ctx.globalAlpha = 1;
  }
  const mp = t >= .65 ? (t - .65) / .5 : t < .15 ? (t + .35) / .5 : -1;
  if (mp >= 0 && mp <= 1) {
    ctx.globalAlpha = Math.min(1, Math.sin(Math.PI * mp) * 4);
    const x = W * (.05 + .9 * mp), y = groundTop - 8 - Math.sin(Math.PI * mp) * groundTop * .7;
    disc(x, y, 7, '#fff6d6'); R(x - 3, y - 2, 2, 2, '#eadfb8'); R(x + 1, y + 1, 2, 2, '#eadfb8'); R(x, y - 4, 1, 1, '#eadfb8');
    ctx.globalAlpha = 1;
  }
  // 구름
  [[40, 18, .9], [170, 38, .6], [300, 12, 1.1], [430, 30, .75]].forEach(([x, y, s]) => {
    const P = W + 80, xx = mod(x - ms * .004 * s, P) - 40;
    cloud(Math.round(xx), y);
  });

  const d = ms / 1000 * 22;   // 걷는 거리 (픽셀)
  // 먼 언덕
  for (let x = 0; x < W; x++) {
    const o = x + d * .08, h = Math.round(Math.sin(o * 2 * Math.PI / 320) * 7 + Math.sin(o * 6 * Math.PI / 320 + 1) * 3);
    R(x, groundTop - 36 - h, 1, 60, '#e7eef9');
  }
  // 먼 소나무
  const FP = 150;
  for (let k = -1; k < W / FP + 2; k++) [20, 75, 120].forEach((px, i) => {
    const x = Math.round(px + k * FP - mod(d * .18, FP));
    pine(x, groundTop - 14, .5, '#8fb0bb', '#a5c2cc');
  });
  // 가까운 언덕
  for (let x = 0; x < W; x++) {
    const o = x + d * .25, h = Math.round(Math.sin(o * 2 * Math.PI / 240 + 1.7) * 5 + Math.sin(o * 4 * Math.PI / 240 + 3) * 2);
    R(x, groundTop - 14 - h, 1, 40, '#d6e3f3');
  }
  // 소나무
  const TP = 200;
  const trees = [[20, 1], [78, .85], [130, 1.1], [182, .9]];
  for (let k = -1; k < W / TP + 2; k++) trees.forEach(([px, s]) => {
    const x = Math.round(px + k * TP - mod(d * .55, TP));
    pine(x, groundTop + 3, s, '#2a6455', '#357a68');
  });
  // 눈 쌓인 땅
  R(0, groundTop, W, H - groundTop, '#f4f8fd');
  R(0, groundTop + 8, W, 2, '#eaf1fa'); R(0, groundTop + 15, W, 2, '#e3edf8');
  R(0, pathTop, W, H - pathTop, '#dbe6f4'); R(0, pathTop, W, 2, '#fff');
  R(0, pathTop + 2, W, 1, '#c8d8ec');
  pebbles.forEach(([px, py]) => { const P = 360, x = mod(px - d * 1.3, P) - 20; for (let xx = x; xx < W + 20; xx += P) R(xx, pathTop + 4 + py % 24, 4, 1, '#fff'); });
  // 가로등·눈사람·눈더미
  const PP = 260;
  for (let k = -1; k < W / PP + 2; k++) {
    const off = k * PP - mod(d, PP);
    mound(Math.round(70 + off), groundTop + 18, 9);
    lamp(Math.round(120 + off), pathTop - 1, sk.night);
    mound(Math.round(205 + off), groundTop + 20, 7);
    snowman(Math.round(235 + off), pathTop - 2);
  }
  // 밤 어둡게
  if (sk.night > .01) { ctx.globalAlpha = sk.night * .38; R(0, 0, W, H, '#0c1445'); ctx.globalAlpha = 1; }

  // 강아지
  const step = Math.floor(ms / 1000 * 11 / (Math.PI * 2) * 8) % 8;
  const pose = {
    walking, phase: step * Math.PI / 4,
    wag: Math.floor(now / 180) % 2, tongue: Math.floor(now / 260) % 2,
    blink: now % 4200 < 140, sway: Math.floor(now / 250) % 2, ear: (now % 3600) < 120
  };
  buildDog(pose);
  const bob = walking && step % 2 ? 1 : 0;
  const dx = Math.round(W / 2 - SW / 2), feet = H - 12, dy = feet - 44 - bob;
  R(dx + 8, feet + 1, 38, 1, 'rgba(27,42,85,.22)'); R(dx + 11, feet + 2, 32, 1, 'rgba(27,42,85,.14)');
  ctx.drawImage(dogCv, dx, dy);

  // 눈 (멈춰 있어도 계속 내림)
  const sec = now / 1000;
  flakes.forEach(f => {
    const x = mod(f.x * W + Math.sin(sec * f.w + f.ph) * 4 - d * f.par, W), y = mod(f.y * H + sec * f.v, H + 4) - 2;
    ctx.globalAlpha = .95;
    R(x, y, f.big ? 2 : 1, f.big ? 2 : 1, '#fff');
  });
  ctx.globalAlpha = 1;

  const phase = t < .2 ? 0 : t < .5 ? 1 : t < .72 ? 2 : 3;
  if (phase !== lastPhase) { lastPhase = phase; $('chip').textContent = `겨울 · ${PHASES[phase]}`; }
}

/* ---------- 스탑워치 ---------- */
let running = false, startT = 0, elapsed = 0, laps = [], lastLap = 0;
const fmt = ms => {
  const t = Math.floor(ms / 10), cs = t % 100, s = Math.floor(t / 100) % 60, m = Math.floor(t / 6000);
  const p = n => String(n).padStart(2, '0');
  return { m: p(m), s: p(s), cs: p(cs) };
};
const text = ms => { const f = fmt(ms); return `${f.m}:${f.s}.${f.cs}`; };
const digits = str => [...str].map(c => `<span class="d">${c}</span>`).join('');
function showTime(ms) {
  const f = fmt(ms);
  $('display').innerHTML = digits(f.m) + '<span class="dot">:</span>' + digits(f.s) + '<small><span class="dot">.</span>' + digits(f.cs) + '</small>';
}
function frame(now) {
  if (running) { elapsed = now - startT; showTime(elapsed); }
  draw(elapsed, now, running);
  requestAnimationFrame(frame);
}
function toggle() {
  if (!running) {
    startT = performance.now() - elapsed;
    $('start').textContent = '잠깐 멈춤'; $('start').className = 'stop';
    $('lap').textContent = '랩'; $('lap').disabled = false;
  } else {
    $('start').textContent = '다시 출발!'; $('start').className = '';
    $('lap').textContent = '처음으로';
  }
  running = !running;
}
function lapOrReset() {
  if (running) {
    laps.unshift({ lap: elapsed - lastLap, total: elapsed });
    lastLap = elapsed; render();
  } else if (elapsed > 0) {
    elapsed = 0; lastLap = 0; laps = []; showTime(0);
    $('start').textContent = '출발!';
    $('lap').textContent = '랩'; $('lap').disabled = true; render();
  }
}
function render() {
  $('lapsPanel').style.display = laps.length ? 'block' : 'none';
  const times = laps.map(l => l.lap), best = Math.min(...times), worst = Math.max(...times);
  $('laps').innerHTML = laps.map((l, i) => {
    const cls = laps.length > 2 ? (l.lap === best ? 'best' : l.lap === worst ? 'worst' : '') : '';
    return `<li class="${cls}"><span>${laps.length - i}</span><span>${text(l.lap)}</span><span>${text(l.total)}</span></li>`;
  }).join('');
}
$('start').onclick = toggle;
$('lap').onclick = lapOrReset;
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key.toLowerCase() === 'l' && !$('lap').disabled) lapOrReset();
  else if (e.key.toLowerCase() === 'r' && !running) lapOrReset();
});
showTime(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
